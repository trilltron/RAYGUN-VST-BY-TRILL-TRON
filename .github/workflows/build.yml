name: build
on: [push, pull_request, workflow_dispatch]
jobs:
  engine-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Engine unit tests (normal + ASan/UBSan)
        run: |
          g++ -std=c++20 -O2 tests/dsp_tests.cpp -o dsp_tests && ./dsp_tests
          g++ -std=c++20 -O1 -g -fsanitize=address,undefined tests/dsp_tests.cpp -o dsp_tests_asan && ./dsp_tests_asan
          g++ -std=c++20 -O3 tests/bench.cpp -o bench && ./bench
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -S . -B build -G "Visual Studio 17 2022" -A x64 -DRAYGUN_BUILD_TOOLS=OFF
      - name: Build VST3 + Standalone (Release, static CRT)
        run: cmake --build build --config Release --target RAYGUN_VST3 RAYGUN_Standalone -j 4
      - name: Package install folder
        shell: bash
        run: |
          tools/package_install.sh build/RAYGUN_artefacts/Release/VST3/RAYGUN.vst3 build/RAYGUN_artefacts/Release/Standalone/RAYGUN.exe install/RAYGUN_Install_Windows
      - uses: actions/upload-artifact@v4
        with: { name: RAYGUN_Install_Windows, path: install/RAYGUN_Install_Windows }
  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DCMAKE_OSX_ARCHITECTURES="arm64;x86_64" -DRAYGUN_BUILD_TOOLS=OFF
      - run: cmake --build build --config Release --target RAYGUN_VST3 RAYGUN_Standalone -j 4
      - uses: actions/upload-artifact@v4
        with: { name: RAYGUN_macOS, path: build/RAYGUN_artefacts/Release }
