name: build
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: write
jobs:
  engine-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Engine unit tests (normal + ASan/UBSan)
        run: |
          g++ -std=c++20 -O2 tests/dsp_tests.cpp -o dsp_tests && ./dsp_tests
          g++ -std=c++20 -O1 -g -fsanitize=address,undefined tests/dsp_tests.cpp -o dsp_tests_asan && ./dsp_tests_asan
          g++ -std=c++20 -O3 tests/bench.cpp -o bench && ./bench
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -S . -B build -A x64 -DRAYGUN_BUILD_TOOLS=OFF
      - name: Build VST3 + Standalone (Release, static CRT)
        run: cmake --build build --config Release --target RAYGUN_VST3 RAYGUN_Standalone RAYGUN_VST2 -j 4
      - name: Package install folder
        shell: bash
        run: |
          tools/package_install.sh build/RAYGUN_artefacts/Release/VST3/RAYGUN.vst3 build/RAYGUN_artefacts/Release/Standalone/RAYGUN.exe install/RAYGUN_Install_Windows "$(find build -name RAYGUN_VST2.dll | head -1)"
      - name: Assemble VST2 setup folder
        shell: bash
        run: |
          mkdir -p RAYGUN_VST2_Setup
          cp "$(find build -name RAYGUN_VST2.dll | head -1)" RAYGUN_VST2_Setup/RAYGUN.dll
          cp install/Windows_VST2/* RAYGUN_VST2_Setup/
          mkdir -p RAYGUN_VST2_Setup/Licenses && cp data/fonts/OFL-*.txt RAYGUN_VST2_Setup/Licenses/
      - name: Zip VST2 setup
        shell: pwsh
        run: Compress-Archive -Path RAYGUN_VST2_Setup -DestinationPath RAYGUN_VST2_Setup.zip -Force
      - name: Zip install folder
        shell: pwsh
        run: Compress-Archive -Path install/RAYGUN_Install_Windows -DestinationPath RAYGUN_Install_Windows.zip -Force
      - uses: actions/upload-artifact@v4
        with: { name: RAYGUN_Install_Windows, path: install/RAYGUN_Install_Windows }
      - name: Publish GitHub Release (Windows install zip)
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        shell: bash
        env: { GH_TOKEN: "${{ github.token }}" }
        run: |
          gh release view windows-latest >/dev/null 2>&1 || gh release create windows-latest --title "RAYGUN for Windows (latest build)" --notes "Unzip, right-click Install_RAYGUN.bat > Run as administrator. See README_FL_STUDIO.txt. Built from commit ${GITHUB_SHA::7}."
          cp build/RAYGUN_artefacts/Release/VST3/RAYGUN.vst3/Contents/x86_64-win/RAYGUN.vst3 RAYGUN_x64.dll
          cp "$(find build -name RAYGUN_VST2.dll | head -1)" RAYGUN_VST2_x64.dll
          gh release upload windows-latest RAYGUN_VST2_Setup.zip RAYGUN_Install_Windows.zip RAYGUN_x64.dll RAYGUN_VST2_x64.dll --clobber
  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure (universal arm64 + x86_64)
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DCMAKE_OSX_ARCHITECTURES="arm64;x86_64" -DCMAKE_OSX_DEPLOYMENT_TARGET=11.0 -DRAYGUN_BUILD_TOOLS=OFF -DRAYGUN_BUILD_VST2=OFF
      - name: Build VST3 + Audio Unit + Standalone
        run: cmake --build build --config Release --target RAYGUN_VST3 RAYGUN_AU RAYGUN_Standalone -j 4
      - name: Package
        run: tools/package_mac.sh build/RAYGUN_artefacts/Release RAYGUN_Install_macOS
      - uses: actions/upload-artifact@v4
        with: { name: RAYGUN_macOS, path: RAYGUN_macOS.zip }
      - name: Publish GitHub Release (macOS zip)
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        env: { GH_TOKEN: "${{ github.token }}" }
        run: |
          gh release view macos-latest >/dev/null 2>&1 || gh release create macos-latest --title "RAYGUN for macOS (latest build)" --notes "Unzip, double-click Install_RAYGUN.command. See README_macOS.txt. Built from commit ${GITHUB_SHA::7}."
          gh release upload macos-latest RAYGUN_macOS.zip --clobber
